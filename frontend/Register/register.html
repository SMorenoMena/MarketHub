<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
    <title>MarketHub-Register</title>
</head>
<body>
    <div class="register">
        <div class="register-header">
            <h1>Crear Cuenta</h1>
            <p>Regístrate en MarketHub para comprar o vender.</p>
        </div>
        <div class="form-container">
            <form>
                <label for="username">Nombre completo</label>
                <input type="text" id="username" name="username" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
                <label for="user-type">¿Cómo te gustaría usar MarketHub?</label>
                <div class="role-selection">
                    <div class="role-option">
                        <input type="radio" id="buyer" name="user-type" value="buyer" required>
                        <label for="buyer">Como Comprador</label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="seller" name="user-type" value="seller" required>
                        <label for="seller">Como Vendedor</label>
                    </div>
                </div>    
                
                 <div class="button-container">   
                    <button type="submit">Crear Cuenta</button>
                    <p>¿Ya tienes una cuenta? <a class="pregunta" href="login.html">Inicia sesión</a></p>
                </div>
            </form>
        </div>
    
    </div>


    
</body>
</html>
