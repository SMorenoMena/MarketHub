<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <div class="Login">
        <div class="Login-header">
            <h1>Iniciar sesión</h1>
            <p>Ingresa a tu cuenta de MarketHub</p>
        </div>
        <form>
         <div class="input">
            <label>Correo electrónico</label>
            <input type="text" name="Correo" placeholder="tucorreo@ejemplo.com">
         </div>       
         <div class="input">
             <label>Contraseña</label>
             <input type="password" name="Contraseña" placeholder="...........">
         </div>
         <div class="botom-container">
            <button type="submit">Iniciar sesión</button>
            <p>¿No tienes cuenta?</p> <a href="">Registrarte</a>
         </div>

        </form>
        
    </div>
</body>
</html>
